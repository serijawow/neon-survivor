<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>냥냥 서바이버 🐱⚡</title>
<meta property="og:title" content="냥냥 서바이버 🐱⚡">
<meta property="og:description" content="움직이기만 해, 공격은 자동! 동네를 점령한 불량 동물들을 갈아버리고 뒷산 대마법사 생쥐를 잡아라!">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🐱</text></svg>">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#79c456;
    font-family:'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    touch-action:none;user-select:none;-webkit-user-select:none;color:#333}
  #c{display:block;width:100%;height:100%}
  .ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;z-index:10;padding:16px;background:rgba(40,70,30,.55);backdrop-filter:blur(7px);overflow-y:auto}
  .hidden{display:none !important}
  .panel{background:#fffdf5;border-radius:26px;padding:26px 22px;max-width:480px;width:100%;
    box-shadow:0 12px 40px rgba(0,0,0,.35);border:4px solid #fff}
  h1{font-size:min(11vw,52px);font-weight:900;letter-spacing:-1px;line-height:1.15;color:#3a8d2f;
    text-shadow:2px 3px 0 #d7f0c2}
  .sub{font-size:min(4vw,16px);color:#555;margin:12px 0 4px;line-height:1.7}
  .sub b{color:#e8651f}
  button{border:none;border-radius:60px;padding:15px 46px;font-size:min(5.6vw,22px);font-weight:900;
    color:#fff;cursor:pointer;font-family:inherit;background:linear-gradient(135deg,#ff9b2f,#ff5f3c);
    box-shadow:0 5px 0 #c94a22,0 8px 20px rgba(0,0,0,.25);transition:transform .08s;margin:8px 4px 2px}
  button:active{transform:translateY(3px);box-shadow:0 2px 0 #c94a22}
  button.ghost{background:#e9e4d6;color:#666;box-shadow:0 4px 0 #c9c4b4;font-size:min(4.2vw,16px);padding:11px 28px}
  .bestline{font-size:min(3.8vw,14px);color:#888;margin-top:12px}
  .coinline{font-size:min(4.6vw,18px);font-weight:900;color:#c98a00;margin-top:10px}
  /* cat select */
  #catRow{display:flex;gap:8px;justify-content:center;margin:14px 0 4px;flex-wrap:wrap}
  .cat{width:96px;background:#fff;border:3px solid #e3ddca;border-radius:18px;padding:10px 4px 8px;cursor:pointer;
    transition:transform .1s,border-color .1s;position:relative}
  .cat:active{transform:scale(.93)}
  .cat.sel{border-color:#3a8d2f;box-shadow:0 0 0 3px #b6e6a0}
  .cat.locked{filter:grayscale(.75);opacity:.8}
  .cat .ce{font-size:38px;line-height:1.1}
  .cat .cn2{font-size:12.5px;font-weight:900;color:#444;margin-top:3px}
  .cat .cp{font-size:11px;color:#777;line-height:1.35;margin-top:2px;min-height:28px}
  .cat .price{font-size:12px;font-weight:900;color:#c98a00;margin-top:3px}
  /* level up cards */
  .lutitle{font-size:min(8.5vw,38px);font-weight:900;color:#fff;margin-bottom:16px;
    text-shadow:0 3px 0 rgba(0,0,0,.25);animation:bump .45s cubic-bezier(.2,2.4,.4,1)}
  @keyframes bump{0%{transform:scale(.2)}100%{transform:scale(1)}}
  #luCards{display:flex;gap:11px;width:100%;max-width:540px;justify-content:center;flex-wrap:wrap}
  .card{flex:1 1 0;min-width:128px;max-width:170px;background:#fffdf5;border:3px solid #e3ddca;
    border-radius:20px;padding:16px 10px 14px;cursor:pointer;color:#333;
    animation:cardin .4s cubic-bezier(.2,1.6,.4,1) backwards;transition:transform .1s;
    box-shadow:0 8px 22px rgba(0,0,0,.3)}
  .card:active{transform:scale(.94)}
  .card.new{border-color:#ffb02f;box-shadow:0 0 0 3px #ffe3ae,0 8px 22px rgba(0,0,0,.3)}
  .card{position:relative}
  .tb{position:absolute;top:-12px;right:-8px;width:34px;height:34px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;color:#fff;
    border:2.5px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.3)}
  .card.tC{border-color:#b8beb9}.tb.tC{background:#9aa39b}
  .card.tB{border-color:#4f9bff}.tb.tB{background:#4f9bff}
  .card.tA{border-color:#b66dff;box-shadow:0 0 14px rgba(182,109,255,.5),0 8px 22px rgba(0,0,0,.3)}.tb.tA{background:#b66dff}
  .card.tS{border-color:#ffb02f;box-shadow:0 0 22px rgba(255,176,47,.85),0 8px 22px rgba(0,0,0,.3);
    animation:cardin .4s cubic-bezier(.2,1.6,.4,1) backwards,sglow 1s ease-in-out infinite alternate}
  .tb.tS{background:linear-gradient(135deg,#ffb02f,#ff5f3c)}
  @keyframes sglow{from{box-shadow:0 0 14px rgba(255,176,47,.6)}to{box-shadow:0 0 30px rgba(255,176,47,1)}}
  @keyframes cardin{from{transform:translateY(60px) scale(.6);opacity:0}}
  .ci{font-size:42px;line-height:1;filter:drop-shadow(0 3px 4px rgba(0,0,0,.2))}
  .cn{font-weight:900;font-size:15.5px;margin:9px 0 3px;color:#333}
  .cl{font-size:12px;font-weight:900;color:#e8651f;margin-bottom:5px}
  .cd{font-size:12px;color:#777;line-height:1.45}
  #chestBox{font-size:88px;animation:shake .12s linear infinite;filter:drop-shadow(0 0 26px rgba(255,210,80,.9))}
  @keyframes shake{0%{transform:rotate(-7deg) scale(1.05)}50%{transform:rotate(7deg)}100%{transform:rotate(-7deg) scale(1.05)}}
  #chestCard .card{animation:bump .5s cubic-bezier(.2,2,.4,1);max-width:200px;cursor:default}
  .big{font-size:min(15vw,72px);font-weight:900;line-height:1.05;color:#3a8d2f;text-shadow:2px 3px 0 #d7f0c2}
  .rk{font-size:min(7vw,28px);font-weight:900;color:#e8651f;margin:8px 0 2px}
  .stats{display:flex;gap:20px;margin:12px 0 4px;font-size:min(4vw,15px);justify-content:center;color:#777}
  .stats b{display:block;font-size:min(6.4vw,25px);color:#3a8d2f}
  #hudBtns{position:fixed;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:8;display:flex;gap:10px}
  #hudBtns button{padding:0;width:46px;height:46px;border-radius:50%;font-size:20px;margin:0;
    background:rgba(255,255,255,.85);box-shadow:0 3px 8px rgba(0,0,0,.25);color:#333}
  #toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#3a8d2f;color:#fff;
    font-weight:900;padding:11px 26px;border-radius:30px;font-size:15px;z-index:30;opacity:0;
    transition:opacity .3s;pointer-events:none;white-space:nowrap}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hudBtns" class="hidden">
  <button id="hudMute">🔊</button><button id="hudPause">⏸</button>
</div>

<div id="menu" class="ov">
  <div class="panel">
    <h1>냥냥 서바이버 🐱</h1>
    <div class="sub" id="mHow"></div>
    <div class="sub" style="margin-top:2px">동네를 점령한 <b>불량 동물들</b>을 갈아버리고<br>뒷산의 <b>대마법사 생쥐</b>를 잡아라! 🧙🐭</div>
    <div id="catRow"></div>
    <div class="coinline">🪙 <span id="mCoins">0</span></div>
    <button id="mStart">출동! 🐾</button>
    <div class="bestline" id="mBest"></div>
  </div>
</div>

<div id="levelup" class="ov hidden">
  <div class="lutitle">🐾 LEVEL UP!</div>
  <div id="luCards"></div>
</div>

<div id="chest" class="ov hidden">
  <div id="chestBox">🎁</div>
  <div id="chestCard" class="hidden" style="display:flex;flex-direction:column;align-items:center">
    <div class="lutitle" style="font-size:min(7vw,28px)">보스 전리품!</div>
    <div id="chestInner"></div>
    <button id="chestClaim">획득 ✨</button>
  </div>
</div>

<div id="pauseOv" class="ov hidden">
  <div class="lutitle">일시정지 😺</div>
  <button id="pResume">계속하기 ▶</button>
  <button id="pQuit" class="ghost">포기하기 🏳</button>
</div>

<div id="results" class="ov hidden">
  <div class="panel">
    <div class="sub" style="margin:0;color:#999" id="rLabel">기록</div>
    <div class="big" id="rTime">0:00</div>
    <div class="rk" id="rRank"></div>
    <div class="stats">
      <div><b id="rKills">0</b>처치</div>
      <div><b id="rLv">1</b>레벨</div>
      <div><b id="rCombo">0</b>최대콤보</div>
    </div>
    <div class="coinline">🪙 +<span id="rCoins">0</span> 획득!</div>
    <div class="bestline" id="rBest"></div>
    <button id="rRetry">다시! 🔁</button>
    <div>
      <button id="rShare" class="ghost">친구 도발하기 📤</button>
      <button id="rHome" class="ghost">처음으로</button>
    </div>
  </div>
</div>

<div id="toast">복사 완료! 📋</div>

<script>
'use strict';
// ============ canvas ============
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,vign=null;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  vign=document.createElement('canvas');vign.width=W;vign.height=H;
  const g=vign.getContext('2d'),rg=g.createRadialGradient(W/2,H/2,Math.min(W,H)*.42,W/2,H/2,Math.max(W,H)*.75);
  rg.addColorStop(0,'rgba(0,0,0,0)');rg.addColorStop(1,'rgba(20,40,10,.32)');g.fillStyle=rg;g.fillRect(0,0,W,H);}
addEventListener('resize',resize);resize();
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a), TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist2=(ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy};
const IS_TOUCH=matchMedia('(pointer:coarse)').matches;

// ============ audio ============
let AC=null,master=null,musicG=null,muted=localStorage.getItem('ns_mute')==='1',noiseBuf=null;
function ac(){
  if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=muted?0:.55;master.connect(AC.destination);
    musicG=AC.createGain();musicG.gain.value=.38;musicG.connect(master);
    noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  if(AC.state==='suspended')AC.resume();return AC;}
function tone(f,dur,type,vol,slide){try{const a=ac(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(1,slide),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur);}catch(e){}}
function noise(dur,vol,freq,type){try{const a=ac(),s=a.createBufferSource(),g=a.createGain(),f=a.createBiquadFilter(),t=a.currentTime;
  s.buffer=noiseBuf;s.loop=true;f.type=type||'highpass';f.frequency.value=freq;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur);}catch(e){}}
function sMeow(){try{const a=ac(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type='sine';o.frequency.setValueAtTime(470,t);
  o.frequency.linearRampToValueAtTime(840,t+.12);o.frequency.linearRampToValueAtTime(350,t+.3);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.22,t+.05);g.gain.linearRampToValueAtTime(.0001,t+.32);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+.33);}catch(e){}}
let lastShot=0,lastGem=0,gemStreak=0;
const sShot=()=>{const n=performance.now();if(n-lastShot<75)return;lastShot=n;tone(640,.06,'square',.045,380);};
const sHit=()=>noise(.05,.07,2500);
const sDie=()=>{noise(.1,.13,1100,'bandpass');tone(300,.12,'triangle',.11,90);};
const sBig=()=>{noise(.3,.22,400,'lowpass');tone(130,.3,'sawtooth',.18,40);};
const sGem=()=>{const n=performance.now();gemStreak=n-lastGem<400?Math.min(gemStreak+1,12):0;lastGem=n;
  tone(640+gemStreak*70,.07,'sine',.11);};
const sCoin=()=>{tone(988,.08,'square',.12);setTimeout(()=>tone(1319,.14,'square',.12),70);};
const sHurt=()=>{sMeow();noise(.15,.16,700,'lowpass');};
const sLevel=()=>[523,659,784,1046,1318].forEach((f,i)=>setTimeout(()=>tone(f,.18,'square',.13),i*70));
const sPick=()=>{tone(880,.1,'triangle',.16);setTimeout(()=>tone(1320,.16,'triangle',.16),80);};
const sHiss=()=>{noise(.28,.22,3000);tone(180,.25,'sawtooth',.1,70);};
const sZap=()=>{noise(.08,.12,4000);tone(1500,.08,'sawtooth',.07,200);};
const sWarn=()=>[0,200,400].forEach(d=>setTimeout(()=>tone(440,.16,'square',.16,330),d));
const sChest=()=>[659,784,1046,1318,1568].forEach((f,i)=>setTimeout(()=>tone(f,.2,'triangle',.15),i*90));
const sClear=()=>[523,659,784,1046,784,1046,1318].forEach((f,i)=>setTimeout(()=>tone(f,.25,'square',.12),i*110));
const sDead=()=>{sMeow();setTimeout(()=>tone(380,.7,'sine',.18,90),200);};
const sJump=()=>tone(300,.15,'sine',.1,600);
const sThud=()=>{noise(.15,.18,300,'lowpass');tone(95,.18,'sine',.22,40);};
const sTele=()=>tone(900,.2,'sine',.12,1800);
// --- bgm: bouncy major loop ---
let mStep=0,mNext=0;
const ROOTS=[65.41,65.41,87.31,98];
setInterval(()=>{
  if(!AC||muted||state!=='playing')return;
  const SPB=60/132/4;
  if(mNext<AC.currentTime)mNext=AC.currentTime+.05;
  while(mNext<AC.currentTime+.14){
    const s=mStep%16,bar=(mStep/16)|0,root=ROOTS[bar%4],inten=1+(gTime>50?1:0)+(gTime>150?1:0);
    if(s%4===0){const o=AC.createOscillator(),g=AC.createGain();o.type='sine';
      o.frequency.setValueAtTime(140,mNext);o.frequency.exponentialRampToValueAtTime(46,mNext+.1);
      g.gain.setValueAtTime(.45,mNext);g.gain.exponentialRampToValueAtTime(.001,mNext+.12);
      o.connect(g);g.connect(musicG);o.start(mNext);o.stop(mNext+.13);}
    if(s%4===2){const o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();
      o.type='triangle';o.frequency.value=root*2;f.type='lowpass';f.frequency.value=600;
      g.gain.setValueAtTime(.3,mNext);g.gain.exponentialRampToValueAtTime(.001,mNext+.15);
      o.connect(f);f.connect(g);g.connect(musicG);o.start(mNext);o.stop(mNext+.17);}
    if(s%2===1&&inten>=2){const src=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();
      src.buffer=noiseBuf;f.type='highpass';f.frequency.value=8500;
      g.gain.setValueAtTime(.05,mNext);g.gain.exponentialRampToValueAtTime(.001,mNext+.03);
      src.connect(f);f.connect(g);g.connect(musicG);src.start(mNext);src.stop(mNext+.04);}
    if(inten>=2&&(s===4||s===12)){const src=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();
      src.buffer=noiseBuf;f.type='bandpass';f.frequency.value=2000;
      g.gain.setValueAtTime(.16,mNext);g.gain.exponentialRampToValueAtTime(.001,mNext+.08);
      src.connect(f);f.connect(g);g.connect(musicG);src.start(mNext);src.stop(mNext+.09);}
    if(inten>=3&&(s===6||s===10||s===14)){const o=AC.createOscillator(),g=AC.createGain();
      o.type='square';const NL=[523,587,659,784,880];
      o.frequency.value=NL[(bar*3+s)%5];
      g.gain.setValueAtTime(.045,mNext);g.gain.exponentialRampToValueAtTime(.001,mNext+.09);
      o.connect(g);g.connect(musicG);o.start(mNext);o.stop(mNext+.1);}
    mStep++;mNext+=SPB;}
},30);

// ============ sticker sprites ============
function sticker(emoji,size,opts){
  opts=opts||{};
  const pad=Math.ceil(size*.42),S=size+pad*2;
  const t=document.createElement('canvas');t.width=t.height=S;
  const g=t.getContext('2d');
  g.textAlign='center';g.textBaseline='middle';g.font=size+'px "Segoe UI Emoji","Apple Color Emoji",sans-serif';
  g.fillText(emoji,S/2,S/2+size*.06);
  if(opts.acc){g.font=(size*(opts.accSize||.5))+'px "Segoe UI Emoji","Apple Color Emoji",sans-serif';
    g.fillText(opts.acc,S/2+(opts.accX||0)*size,S/2+(opts.accY||0)*size);}
  if(opts.deco)opts.deco(g,S,size);
  // white silhouette
  const o=document.createElement('canvas');o.width=o.height=S;
  const og=o.getContext('2d'),R=Math.max(2.5,size*.075);
  for(let i=0;i<16;i++){const a=i/16*TAU;og.drawImage(t,Math.cos(a)*R,Math.sin(a)*R);}
  og.globalCompositeOperation='source-in';og.fillStyle='#fff';og.fillRect(0,0,S,S);
  // final with shadow
  const f=document.createElement('canvas');f.width=f.height=S;
  const fg=f.getContext('2d');
  fg.shadowColor='rgba(30,50,20,.3)';fg.shadowBlur=5;fg.shadowOffsetY=3;
  fg.drawImage(o,0,0);
  fg.shadowColor='transparent';fg.shadowBlur=0;fg.shadowOffsetY=0;
  fg.drawImage(t,0,0);
  return {n:f,w:o,half:S/2};}
// ============ cartoon drawing toolkit ============
const OUT='#3a3128';
function toon(size,fn){
  const pad=Math.ceil(size*.32),S=size+pad*2;
  const t=document.createElement('canvas');t.width=t.height=S;
  const g=t.getContext('2d');
  g.translate(S/2,S/2);g.lineJoin='round';g.lineCap='round';
  fn(g,size/2);
  const o=document.createElement('canvas');o.width=o.height=S;
  const og=o.getContext('2d');
  og.drawImage(t,0,0);og.globalCompositeOperation='source-in';
  og.fillStyle='#fff';og.fillRect(0,0,S,S);
  const f=document.createElement('canvas');f.width=f.height=S;
  const fg=f.getContext('2d');
  fg.shadowColor='rgba(30,40,20,.28)';fg.shadowBlur=4;fg.shadowOffsetY=2;
  fg.drawImage(t,0,0);
  return {n:f,w:o,half:S/2};}
function el(g,x,y,rx,ry,col,lw){g.beginPath();g.ellipse(x,y,rx,ry,0,0,TAU);
  if(col){g.fillStyle=col;g.fill();}
  if(lw){g.strokeStyle=OUT;g.lineWidth=lw;g.stroke();}}
function poly2(g,pts,col,lw){g.beginPath();g.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++)g.lineTo(pts[i][0],pts[i][1]);g.closePath();
  if(col){g.fillStyle=col;g.fill();}
  if(lw){g.strokeStyle=OUT;g.lineWidth=lw;g.stroke();}}
function eye(g,x,y,r,o){o=o||{};
  el(g,x,y,r,r*1.12,'#fff',r*.22);
  const px=x,py=y+r*.16;
  el(g,px,py,r*.46,r*.46,o.pcol||OUT);
  el(g,px+r*.16,py-r*.18,r*.15,r*.15,'#fff');
  if(o.lid){g.beginPath();g.moveTo(x-r*1.05,y-r*.5);g.lineTo(x+r*1.05,y-r*.5-o.lid*r*.55);
    g.strokeStyle=OUT;g.lineWidth=r*.24;g.stroke();}}
function dotEye(g,x,y,r){el(g,x,y,r,r,OUT);el(g,x+r*.32,y-r*.32,r*.32,r*.32,'#fff');}
function blushy(g,x,y,r){g.globalAlpha=.45;el(g,x,y,r,r*.6,'#ff9d9d');g.globalAlpha=1;}
function angryBrow(g,x,y,r,s){g.beginPath();g.moveTo(x-s*r*.5,y-r*.18);g.lineTo(x+s*r*.5,y+r*.18);
  g.strokeStyle=OUT;g.lineWidth=r*.3;g.stroke();}
function catMouth(g,r){

function director(dt){

      stageIdx++;prevBgIdx=stageIdx-1;bgFade=0;stageStart=gTime;midDone=false;bossDone=false;surged=[];

  if(spawnT<=0){spawnT=interval;

      banner('⚠ 떼거지 출몰!! ⚠','#ff3860',1.5);shake=7;

function damageEnemy(e,dmg,hx,hy){
  const mul=(e.beh==='boar'&&e.st.ph==='dizzy')?1.45:1;
  const crit=Math.random()<.12,v=Math.round(dmg*player.dmgMul*mul*(crit?2:1));
  e.hp-=v;e.flash=1;sHit();
  floater(e.x+rnd(-8,8),e.y-e.r-6,crit?v+'!':''+v,crit?'#ffb02f':'#fff',crit);
  if(hx!==undefined&&!e.boss){const d=Math.sqrt(dist2(hx,hy,e.x,e.y))||1;
    e.kx+=(e.x-hx)/d*90;e.ky+=(e.y-hy)/d*90;}
  if(e.hp<=0)killEnemy(e);}
function killEnemy(e){
  const i=enemies.indexOf(e);if(i<0)return;enemies.splice(i,1);
  kills++;combo++;comboT=1.7;maxCombo=Math.max(maxCombo,combo);

  burst(e.x,e.y,['#ffb02f','#ff5f3c','#7ec8ff','#ffe066'],e.boss?40:10,e.boss?11:6);
  if(e.boss){sBig();freezeT=Math.max(freezeT,.07);shake=Math.max(shake,12);}
  else{sDie();shake=Math.max(shake,2);}
  if(e.beh==='split')for(let k=0;k<2;k++)spawnEnemy('slimeS',e.x+rnd(-14,14),e.y+rnd(-14,14));
  if(e.beh==='fuse')explode(e.x,e.y,85,0);
  dropGem(e.x,e.y,e.xp);
  let c=e.coin;if(e.meals>=4)c+=3;
  if(!c&&Math.random()<.025)c=1;
  for(let k=0;k<c;k++)if(coinDrops.length<60)coinDrops.push({x:e.x+rnd(-14,14),y:e.y+rnd(-14,14),t:0});
  // item drops
  if(e.mid){dropItem(e.x-20,e.y,'chicken');
    dropItem(e.x+20,e.y,SKILL_KEYS[(Math.random()*SKILL_KEYS.length)|0]);}
  else if(e.meals>=4)dropItem(e.x,e.y,SKILL_KEYS[(Math.random()*SKILL_KEYS.length)|0]);
  else if(!e.boss){
    const pity=player.hp<player.maxhp*.35?2:1;
    if(Math.random()<.02*pity)dropItem(e.x,e.y,'chicken');
    else if(Math.random()<.007)dropItem(e.x,e.y,SKILL_KEYS[(Math.random()*SKILL_KEYS.length)|0]);}
  if(e.boss){
    // enrage partner (duo)
    for(const o of enemies)if(o.boss&&(o.beh==='flyB'||o.beh==='mosqB')){o.st.rage=true;}
    if(!bossesAlive()){
      slowT=.5;
      if(e.mid){openChest();}
      else{ // stage boss down
        openChest();
        // gem rain: convert all mobs
        for(const o of enemies.slice())if(!o.boss){
          dropGem(o.x,o.y,o.xp);puff(o.x,o.y,3);
          enemies.splice(enemies.indexOf(o),1);}
        if(!cleared){
          if(stageIdx>=2){cleared=true;endlessAt=gTime;nextEndBoss=gTime+50;
            sClear();banner('🏆 동네 평정!! 클리어!!','#ffe066',2.6);
            setTimeout(()=>{if(state==='playing')banner('😈 엔드리스: 놈들의 복수가 시작된다','#ff3860',2.2);},2800);
            burst(player.x,player.y,['#ffe066','#7ec8ff','#ff8ad8'],90,12);}
          else{bossDone=true;bossSpawned=false;breather=2.5;
            banner('✅ 스테이지 클리어!','#ffe066',2);sClear();}}}}}
  const M={15:'연쇄냥!!',30:'학살냥!!',60:'고양이님이 미쳐날뛴다!!!',120:'전설의 발톱!!!'};
  if(M[combo]&&lastMile!==combo){lastMile=combo;banner(combo+'콤보 '+M[combo],'#ffb02f',1.2);
    freezeT=Math.max(freezeT,.05);sLevel();}}
function explode(x,y,R,pdmg){
  fxs.push({kind:'nova',x,y,r:10,max:R,t:0,col:'#ff9e2c'});
  burst(x,y,['#ff9e2c','#ffe066'],20,9);sThud();shake=Math.max(shake,6);
  for(const e of enemies.slice())if(dist2(x,y,e.x,e.y)<R*R)damageEnemy(e,30,x,y);
  if(pdmg&&player.iT<=0&&dist2(x,y,player.x,player.y)<(R*.85)*(R*.85))hurtPlayer(pdmg);}
function dropGem(x,y,v){
  if(gems.length>=170){gems[(Math.random()*gems.length)|0].v+=v;return;}
  gems.push({x:x+rnd(-6,6),y:y+rnd(-6,6),v,t:0});}
function hurtPlayer(dmg){
  if(player.iT>0||state!=='playing')return;
  if(player.shieldT>0){floater(player.x,player.y-30,'무적!','#ffd75a',true);return;}
  dmg=Math.round(dmg||10);
  const before=player.hp;
  player.hp-=dmg;player.iT=.95;sHurt();shake=Math.min(8+dmg*.4,16);flashR=1;combo=0;lastMile=0;
  floater(player.x+rnd(-8,8),player.y-32,'-'+dmg,'#ff3860',true);
  burst(player.x,player.y,['#ff5f3c','#fff'],20,9);
  for(const e of enemies){if(e.boss)continue;
    const d=Math.sqrt(dist2(e.x,e.y,player.x,player.y));
    if(d<170){e.kx+=(e.x-player.x)/d*260;e.ky+=(e.y-player.y)/d*260;}}
  const TH=player.maxhp*.25;
  if(player.hp<=TH&&before>TH&&player.hp>0){slowT=.45;banner('☠ 위험!!','#ff3860',1);}
  if(player.hp<=0){player.hp=0;gameOver();}}
function efire(x,y,vx,vy,spr,r,life,dmg){
  if(ebullets.length>130)return;
  ebullets.push({x,y,vx,vy,spr,r:r||8,life:life||5,dmg:dmg||10,spin:rnd(-4,4),rot:rnd(0,TAU)});}
function addZone(x,y,r,warn,burn,col,dmg){
  if(zones.length>24)return;
  zones.push({x,y,r,warn,burn:burn||0,col:col||'#ff5f3c',dmg:dmg||12,max:warn});}
function dropItem(x,y,kind){
  if(drops.length>30)return;
  drops.push({x,y,kind,t:rnd(0,3)});}
function pickupDrop(kind){
  if(kind==='chicken'){
    const heal=35;player.hp=Math.min(player.maxhp,player.hp+heal);
    floater(player.x,player.y-34,'+'+heal+' ❤','#52c84a',true);
    burst(player.x,player.y,['#52c84a','#fff'],10,5);
    tone(523,.12,'sine',.15);setTimeout(()=>tone(784,.18,'sine',.15),90);return;}
  const sk=SKILLS[kind];if(!sk)return;
  if(player.skill&&player.skill.key===kind)player.skill.uses+=sk.uses;
  else player.skill={key:kind,uses:sk.uses};
  sChest();flashW=.6;
  banner('🆕 '+sk.name+' ×'+player.skill.uses,'#fff',1.6);
  floater(player.x,player.y-34,(IS_TOUCH?'왼쪽 버튼':'스페이스/버튼')+'으로 사용!','#ffe066',true);}
function useSkill(){
  if(state!=='playing'||!player.skill||skillCd>0)return;
  skillCd=.6;const key=player.skill.key;
  player.skill.uses--;if(player.skill.uses<=0)player.skill=null;
  if(key==='nuke'){
    flashW=1;shake=16;freezeT=Math.max(freezeT,.08);sBig();sMeow();
    banner('💥 폭풍 냥냥펀치!!','#ff5f3c',1.3);
    const R=Math.max(W,H)*.8;
    fxs.push({kind:'nova',x:player.x,y:player.y,r:30,max:R*.7,t:0,col:'#ff5f3c'});
    for(const e of enemies.slice())if(dist2(player.x,player.y,e.x,e.y)<R*R)
      damageEnemy(e,140,player.x,player.y);}
  else if(key==='freeze'){
    frzT=6;sTele();banner('⏳ 낮잠 타임~ 쿨쿨','#7ec8ff',1.5);
    flashW=.5;}
  else if(key==='shield'){
    player.shieldT=4;sLevel();banner('🥛 무적 우유!','#ffe066',1.2);
    burst(player.x,player.y,['#ffe066','#fff'],16,7);}
  else if(key==='vacuum'){
    noise(.5,.2,900,'bandpass');sCoin();banner('🌪 참치 태풍!!','#7ec8ff',1.3);
    for(const g of gems)g.vac=1;
    for(const g of coinDrops)g.vac=1;
    for(const g of drops)g.vac=1;}}

// ============ enemy AI ============
function updateEnemy(e,dt){
  if(frzT>0){e.flash*=Math.pow(.001,dt);
    if(Math.random()<dt*.06)floater(e.x+rnd(-8,8),e.y-e.r,'💤','#fff',false);
    return;}
  e.wob+=dt*3;e.bIT-=dt;e.flash*=Math.pow(.001,dt);
  const dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;
  e.face=dx<0?-1:1;
  const S=e.st;
  switch(e.beh){
    case 'chase':
      e.x+=(dx/d*e.sp+Math.cos(e.wob)*14)*dt;e.y+=(dy/d*e.sp+Math.sin(e.wob)*14)*dt;break;
    case 'dart':{const sp=e.sp*(.5+.8*Math.abs(Math.sin(e.wob)));
      e.x+=(dx/d*sp+Math.cos(e.wob*1.7)*30)*dt;e.y+=(dy/d*sp+Math.sin(e.wob*1.7)*30)*dt;break;}
    case 'turret':{S.t=(S.t||rnd(1,2))-dt;
      if(S.t<=0&&d<620){S.t=2.6;sShot();
        efire(e.x,e.y,dx/d*185,dy/d*185,'leaf',7,4.5,10);
        puff(e.x,e.y-10,2);}
      if(d>1000){const di=enemies.indexOf(e);if(di>=0)enemies.splice(di,1);return;}
      break;}
    case 'rush':
      if(!S.ph)S.ph='walk';
      if(S.ph==='walk'){e.x+=dx/d*e.sp*dt;e.y+=dy/d*e.sp*dt;
        if(d<270){S.ph='aim';S.t=.65;S.ang=Math.atan2(dy,dx);}}
      else if(S.ph==='aim'){S.t-=dt;S.ang=Math.atan2(dy,dx);
        if(S.t<=0){S.ph='dash';S.t=.85;sJump();}}
      else if(S.ph==='dash'){S.t-=dt;
        e.x+=Math.cos(S.ang)*510*dt;e.y+=Math.sin(S.ang)*510*dt;
        if(parts.length<500)parts.push({x:e.x,y:e.y,vx:0,vy:0,life:.3,col:'#cfd8c2',sz:5,puff:1});
        if(S.t<=0){S.ph='tired';S.t=1.1;}}
      else{S.t-=dt;if(S.t<=0)S.ph='walk';}
      break;
    case 'hop':
      if(!S.ph){S.ph='idle';S.t=rnd(.4,1);}
      if(S.ph==='idle'){S.t-=dt;
        if(S.t<=0&&d<520){S.ph='air';S.t=.55;S.x0=e.x;S.y0=e.y;
          const jd=Math.min(d,230);S.x1=e.x+dx/d*jd;S.y1=e.y+dy/d*jd;sJump();}}
      else{S.t-=dt;const pr=1-S.t/.55;
        e.x=S.x0+(S.x1-S.x0)*pr;e.y=S.y0+(S.y1-S.y0)*pr;
        e.air=Math.sin(pr*Math.PI)*42;
        if(S.t<=0){S.ph='idle';S.t=rnd(.7,1.2);e.air=0;sThud();
          fxs.push({kind:'nova',x:e.x,y:e.y,r:8,max:62,t:0,col:'#7dd87d'});
          if(player.iT<=0&&dist2(e.x,e.y,player.x,player.y)<62*62)hurtPlayer(14);}}
      break;
    case 'split':
      e.x+=(dx/d*e.sp+Math.cos(e.wob)*10)*dt;e.y+=(dy/d*e.sp+Math.sin(e.wob)*10)*dt;
      e.scale=1+Math.sin(e.wob*2)*.08;break;
    case 'fuse':
      if(S.fuse===undefined)S.fuse=-1;
      if(S.fuse<0){e.x+=dx/d*e.sp*dt;e.y+=dy/d*e.sp*dt;
        if(d<70)S.fuse=.55;}
      else{S.fuse-=dt;
        if(S.fuse<=0){const i=enemies.indexOf(e);if(i>=0)enemies.splice(i,1);
          explode(e.x,e.y,92,18);return;}}
      break;
    case 'eat':{
      let prey=null,pd=500*500;
      for(const o of enemies)if(o!==e&&!o.boss&&o.beh!=='eat'){
        const dd=dist2(e.x,e.y,o.x,o.y);if(dd<pd){pd=dd;prey=o;}}
      if(prey&&e.meals<6){const pdx=prey.x-e.x,pdy=prey.y-e.y,pl=Math.hypot(pdx,pdy)||1;
        e.face=pdx<0?-1:1;
        e.x+=pdx/pl*(e.sp+18)*dt;e.y+=pdy/pl*(e.sp+18)*dt;
        if(pl<e.r*e.scale+prey.r){enemies.splice(enemies.indexOf(prey),1);
          e.meals++;e.hp+=prey.maxhp*.6;e.maxhp+=prey.maxhp*.6;
          e.scale=Math.min(2.3,e.scale*1.13);e.sp+=4;
          floater(e.x,e.y-e.r-10,'냠!','#ffb02f',true);puff(e.x,e.y,4);}}
      else{e.x+=dx/d*e.sp*.8*dt;e.y+=dy/d*e.sp*.8*dt;}
      break;}
    case 'swoop':
      if(S.vx===undefined){S.vx=rnd(-100,100);S.vy=rnd(-100,100);}
      S.vx+=dx/d*150*dt;S.vy+=dy/d*150*dt;
      {const v=Math.hypot(S.vx,S.vy);if(v>235){S.vx*=235/v;S.vy*=235/v;}}
      e.face=S.vx<0?-1:1;
      e.x+=S.vx*dt;e.y+=S.vy*dt;break;
    // ---- bosses ----
    case 'boar':
      if(!S.ph){S.ph='stalk';S.t=1.6;}
      if(S.ph==='stalk'){S.t-=dt;e.x+=dx/d*e.sp*dt;e.y+=dy/d*e.sp*dt;
        if(S.t<=0){S.ph='aim';S.t=.8;}}
      else if(S.ph==='aim'){S.t-=dt;S.ang=Math.atan2(dy,dx);
        if(S.t<=0){S.ph='charge';S.t=1.1;sJump();shake=Math.max(shake,5);}}
      else if(S.ph==='charge'){S.t-=dt;
        e.x+=Math.cos(S.ang)*600*dt;e.y+=Math.sin(S.ang)*600*dt;
        if(parts.length<500)parts.push({x:e.x+rnd(-10,10),y:e.y+rnd(-10,10),vx:0,vy:0,life:.4,col:'#d8cfc2',sz:7,puff:1});
        if(S.t<=0){S.ph='dizzy';S.t=1.7;sThud();shake=Math.max(shake,8);
          fxs.push({kind:'nova',x:e.x,y:e.y,r:10,max:80,t:0,col:'#d8cfc2'});}}
      else{S.t-=dt;if(S.t<=0){S.ph='stalk';S.t=1.4;}}
      break;
    case 'frogq':
      if(!S.ph){S.ph='hop';S.t=.8;S.spit=4;}
      S.spit-=dt;
      if(S.spit<=0){S.spit=5;spawnEnemy('slimeS',e.x+rnd(-20,20),e.y+rnd(-20,20));
        spawnEnemy('slimeS',e.x+rnd(-20,20),e.y+rnd(-20,20));puff(e.x,e.y,3);}
      if(S.ph==='hop'){S.t-=dt;
        if(S.t<=0){
          if(S.hops===undefined)S.hops=0;
          S.hops++;
          if(S.hops%3===0){S.ph='bigjump';S.t=1;S.tx=player.x;S.ty=player.y;
            addZone(S.tx,S.ty,115,1,0,'#7dd87d',20);sWarn();S.x0=e.x;S.y0=e.y;}
          else{S.ph='air';S.t=.5;S.x0=e.x;S.y0=e.y;
            const jd=Math.min(d,200);S.x1=e.x+dx/d*jd;S.y1=e.y+dy/d*jd;sJump();}}}
      else if(S.ph==='air'){S.t-=dt;const pr=1-S.t/.5;
        e.x=S.x0+(S.x1-S.x0)*pr;e.y=S.y0+(S.y1-S.y0)*pr;e.air=Math.sin(pr*Math.PI)*50;
        if(S.t<=0){S.ph='hop';S.t=.9;e.air=0;sThud();}}
      else if(S.ph==='bigjump'){S.t-=dt;const pr=1-S.t/1;
        e.x=S.x0+(S.tx-S.x0)*pr;e.y=S.y0+(S.ty-S.y0)*pr;e.air=Math.sin(pr*Math.PI)*150;
        if(S.t<=0){S.ph='hop';S.t=1.1;e.air=0;sThud();shake=Math.max(shake,10);
          fxs.push({kind:'nova',x:e.x,y:e.y,r:14,max:115,t:0,col:'#7dd87d'});
          if(player.iT<=0&&dist2(e.x,e.y,player.x,player.y)<115*115)hurtPlayer(20);}}
      break;
    case 'topgun':{
      if(S.ang===undefined){S.ang=rnd(0,TAU);S.mode='orbit';S.t=3.2;S.volley=2.5;}
      S.t-=dt;
      if(S.mode==='orbit'){
        S.ang+=dt*(S.rage?2.2:1.6);
        const R=255;
        const tx=player.x+Math.cos(S.ang)*R,ty=player.y+Math.sin(S.ang)*R;
        e.x+=(tx-e.x)*Math.min(1,dt*4);e.y+=(ty-e.y)*Math.min(1,dt*4);
        S.volley-=dt;
        if(S.volley<=0){S.volley=4;sShot();
          for(let i=0;i<10;i++){const a=i/10*TAU;
            efire(e.x,e.y,Math.cos(a)*150,Math.sin(a)*150,'feather',7,4,10);}}
        if(S.t<=0){S.mode='aim';S.t=.6;}}
      else if(S.mode==='aim'){S.t-=dt;S.ang2=Math.atan2(dy,dx);
        if(S.t<=0){S.mode='dash';S.t=.9;sJump();}}
      else{S.t-=dt;
        e.x+=Math.cos(S.ang2)*640*dt;e.y+=Math.sin(S.ang2)*640*dt;
        if(((S.t*10)|0)%2===0)efire(e.x,e.y,Math.cos(S.ang2+Math.PI/2)*130,Math.sin(S.ang2+Math.PI/2)*130,'feather',7,3,10);
        if(S.t<=0){S.mode='orbit';S.t=3.2;}}
      e.face=(player.x-e.x)<0?-1:1;
      break;}
    case 'flyB':{
      // keeps distance, summons
      const want=300;
      const m=(d-want)/Math.abs(d-want||1);
      e.x+=dx/d*e.sp*m*dt+Math.cos(e.wob)*30*dt;
      e.y+=dy/d*e.sp*m*dt+Math.sin(e.wob)*30*dt;
      S.sum=(S.sum===undefined?3:S.sum)-dt;
      if(S.sum<=0){S.sum=S.rage?3.5:6;
        for(let i=0;i<3;i++)spawnEnemy('fly',e.x+rnd(-30,30),e.y+rnd(-30,30));
        floater(e.x,e.y-e.r-10,'쫄따구들!','#fff',true);puff(e.x,e.y,3);}
      S.goo=(S.goo===undefined?4:S.goo)-dt;
      if(S.goo<=0){S.goo=S.rage?4:7;sShot();
        const base=Math.atan2(dy,dx);
        for(let i=0;i<4;i++){const a=base+(i-1.5)*.25;
          efire(e.x,e.y,Math.cos(a)*170,Math.sin(a)*170,'leaf',8,4,12);}}
      break;}
    case 'mosqB':
      if(!S.ph){S.ph='orbit';S.t=2.8;S.ang=rnd(0,TAU);}
      if(S.ph==='orbit'){S.t-=dt;S.ang+=dt*(S.rage?2.4:1.7);
        const R=210;
        const tx=player.x+Math.cos(S.ang)*R,ty=player.y+Math.sin(S.ang)*R;
        e.x+=(tx-e.x)*Math.min(1,dt*4.5);e.y+=(ty-e.y)*Math.min(1,dt*4.5);
        if(S.t<=0){S.ph='aim';S.t=.55;}}
      else if(S.ph==='aim'){S.t-=dt;S.ang2=Math.atan2(dy,dx);
        if(S.t<=0){S.ph='dash';S.t=.7;sJump();}}
      else{S.t-=dt;
        e.x+=Math.cos(S.ang2)*560*dt;e.y+=Math.sin(S.ang2)*560*dt;
        if(player.iT<=0&&d<e.r+player.r+6){hurtPlayer(14);
          e.hp=Math.min(e.maxhp,e.hp+e.maxhp*.1);
          floater(e.x,e.y-e.r-10,'🩸 흡혈!','#ff3860',true);}
        if(S.t<=0){S.ph='orbit';S.t=S.rage?1.8:2.8;}}
      break;
    case 'racc':{
      e.x+=dx/d*e.sp*dt;e.y+=dy/d*e.sp*dt;
      S.orb=(S.orb||0)+dt*2.6;
      // orbiting trash hits player
      for(let i=0;i<3;i++){const a=S.orb+i/3*TAU,
        tx=e.x+Math.cos(a)*88,ty=e.y+Math.sin(a)*88;
        if(player.iT<=0&&dist2(tx,ty,player.x,player.y)<(16+player.r)*(16+player.r))hurtPlayer(14);}
      S.lob=(S.lob===undefined?3:S.lob)-dt;
      if(S.lob<=0){S.lob=6;sWarn();
        for(let i=0;i<3;i++)addZone(player.x+rnd(-110,110),player.y+rnd(-110,110),80,1.15,0,'#ffb02f',16);}
      break;}
    case 'mage':{
      if(!S.act){S.act='idle';S.t=1.2;S.cycle=0;}
      const ph2=e.hp<e.maxhp*.5;
      if(S.act==='idle'){
        e.x+=dx/d*e.sp*dt;e.y+=dy/d*e.sp*dt;
        S.t-=dt;
        if(S.t<=0){S.cycle++;
          const acts=['ring','zones','tele','summon'];
          S.act=acts[S.cycle%4];S.t=.4;}}
      else if(S.act==='ring'){S.t-=dt;
        if(S.t<=0){sZap();const n=ph2?22:14;
          for(let i=0;i<n;i++){const a=i/n*TAU+S.cycle;
            efire(e.x,e.y,Math.cos(a)*(ph2?160:125),Math.sin(a)*(ph2?160:125),'orb',7,6,12);}
          S.act='idle';S.t=ph2?2.2:3.2;}}
      else if(S.act==='zones'){S.t-=dt;
        if(S.t<=0){sWarn();
          for(let i=0;i<(ph2?4:3);i++)addZone(player.x+rnd(-130,130),player.y+rnd(-130,130),85,1,1.8,'#b66dff',12);
          S.act='idle';S.t=3;}}
      else if(S.act==='tele'){S.t-=dt;
        if(S.t<=0){sTele();puff(e.x,e.y,8);
          const a=rnd(0,TAU);e.x=player.x+Math.cos(a)*300;e.y=player.y+Math.sin(a)*300;
          puff(e.x,e.y,8);S.act='idle';S.t=1.6;}}
      else{S.t-=dt;
        if(S.t<=0){for(let i=0;i<4;i++)spawnEnemy('mouse',e.x+rnd(-40,40),e.y+rnd(-40,40));
          floater(e.x,e.y-e.r-12,'나와라 부하들!','#b66dff',true);
          S.act='idle';S.t=3;}}
      break;}
  }
  // knockback + teleport-behind cleanup
  e.x+=e.kx*dt;e.y+=e.ky*dt;
  e.kx*=Math.pow(.002,dt);e.ky*=Math.pow(.002,dt);
  const dd=Math.hypot(player.x-e.x,player.y-e.y);
  if(!e.boss&&e.beh!=='turret'&&dd>Math.max(W,H)*.95){
    const a=rnd(0,TAU),R=Math.max(W,H)*.6;
    e.x=player.x+Math.cos(a)*R;e.y=player.y+Math.sin(a)*R;}
  // contact damage
  if(player.iT<=0&&!e.air&&dd<e.r*e.scale+player.r)hurtPlayer(e.dmg+(e.meals||0)*2);
}

// ============ weapons ============
function updateWeapons(dt){
  const wp=player.weapons;
  if(wp.pulse){const w=wp.pulse,cd=Math.max(.22,(.55-.045*w.lv))*player.cdMul;
    w.t-=dt;if(w.t<=0){const tgt=nearestEnemy(player.x,player.y,750);
      if(tgt){w.t=cd;const n=1+((w.lv)/2|0),base=Math.atan2(tgt.y-player.y,tgt.x-player.x);
        for(let i=0;i<n;i++){const a=base+(i-(n-1)/2)*.14;
          bullets.push({kind:'pulse',x:player.x,y:player.y,vx:Math.cos(a)*540,vy:Math.sin(a)*540,
            dmg:6+2.2*w.lv,r:7,life:1.3,pierce:w.lv>=4?1:0,rot:a});}
        sShot();}else w.t=.1;}}
  if(wp.blades){const w=wp.blades;bladeAngle+=dt*(2.6+.35*w.lv);
    const n=1+w.lv,R=74+6*w.lv;
    for(let i=0;i<n;i++){const a=bladeAngle+i/n*TAU,
      bx=player.x+Math.cos(a)*R,by=player.y+Math.sin(a)*R;
      for(const e of enemies)if(e.bIT<=0&&dist2(bx,by,e.x,e.y)<(17+e.r)*(17+e.r)){
        e.bIT=.38;damageEnemy(e,8+3*w.lv,player.x,player.y);}}}
  if(wp.bolt){const w=wp.bolt,cd=Math.max(.7,(2.3-.22*w.lv))*player.cdMul;
    w.t=(w.t||0)-dt;if(w.t<=0){const first=nearestEnemy(player.x,player.y,500);
      if(first){w.t=cd;sZap();const chain=[first];let cur=first;
        for(let i=0;i<1+w.lv;i++){let nx=null,bd=300*300;
          for(const e of enemies)if(!chain.includes(e)){const d=dist2(cur.x,cur.y,e.x,e.y);
            if(d<bd){bd=d;nx=e;}}
          if(!nx)break;chain.push(nx);cur=nx;}
        let px=player.x,py=player.y;
        for(const e of chain){fxs.push({kind:'bolt',x1:px,y1:py,x2:e.x,y2:e.y,t:0});
          damageEnemy(e,11+4*w.lv);px=e.x;py=e.y;}}else w.t=.15;}}
  if(wp.missile){const w=wp.missile,cd=Math.max(.8,(2-.15*w.lv))*player.cdMul;
    w.t=(w.t||0)-dt;if(w.t<=0&&enemies.length){w.t=cd;
      for(let i=0;i<w.lv;i++){const a=rnd(0,TAU);
        bullets.push({kind:'missile',x:player.x,y:player.y,vx:Math.cos(a)*220,vy:Math.sin(a)*220,
          dmg:14+4*w.lv,r:9,life:2.4,tgt:enemies[(Math.random()*enemies.length)|0],rot:0});}
      tone(500,.12,'square',.07,900);}}
  if(wp.nova){const w=wp.nova,cd=Math.max(1.6,(4.2-.4*w.lv))*player.cdMul;
    w.t=(w.t||0)-dt;if(w.t<=0){w.t=cd;const R=125+26*w.lv;
      fxs.push({kind:'nova',x:player.x,y:player.y,r:14,max:R,t:0,col:'#ff8ad8'});
      fxs.push({kind:'hiss',x:player.x,y:player.y,t:0});
      sHiss();shake=Math.max(shake,5);
      for(const e of enemies.slice())if(dist2(player.x,player.y,e.x,e.y)<R*R)
        damageEnemy(e,16+6*w.lv,player.x,player.y);}}}

// ============ update ============
function update(dt){
  gTime+=dt;tutT-=dt;
  let mx=0,my=0;
  if(keys.ArrowLeft||keys.a)mx--;if(keys.ArrowRight||keys.d)mx++;
  if(keys.ArrowUp||keys.w)my--;if(keys.ArrowDown||keys.s)my++;
  if(joy.on&&(joy.dx||joy.dy)){mx=joy.dx;my=joy.dy;}
  const ml=Math.hypot(mx,my);
  if(ml>0){mx/=ml;my/=ml;
    if(Math.abs(mx)>.2)player.face=mx<0?-1:1;
    player.x+=mx*player.speed*dt;player.y+=my*player.speed*dt;walkT+=dt;}
  player.iT-=dt;
  cam.x+=(player.x-cam.x)*Math.min(1,dt*5);
  cam.y+=(player.y-cam.y)*Math.min(1,dt*5);
  bgFade=Math.min(1,bgFade+dt*.8);
  director(dt);
  updateWeapons(dt);
  for(const e of enemies.slice())updateEnemy(e,dt);
  // player bullets
  for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];
    b.life-=dt;if(b.life<=0){bullets.splice(i,1);continue;}
    if(b.kind==='missile'){
      if(!b.tgt||b.tgt.hp<=0||!enemies.includes(b.tgt))b.tgt=enemies.length?enemies[(Math.random()*enemies.length)|0]:null;
      if(b.tgt){const dx=b.tgt.x-b.x,dy=b.tgt.y-b.y,d=Math.hypot(dx,dy)||1;
        b.vx+=(dx/d*900)*dt;b.vy+=(dy/d*900)*dt;
        const v=Math.hypot(b.vx,b.vy);if(v>360){b.vx*=360/v;b.vy*=360/v;}}
      b.rot+=dt*9;}
    else b.rot=Math.atan2(b.vy,b.vx);
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    for(const e of enemies){if(dist2(b.x,b.y,e.x,e.y)<(b.r+e.r*e.scale)*(b.r+e.r*e.scale)){
      if(b.kind==='missile'){bullets.splice(i,1);
        fxs.push({kind:'nova',x:b.x,y:b.y,r:8,max:55,t:0,col:'#ff8ad8'});
        noise(.18,.13,600,'lowpass');
        for(const o of enemies.slice())if(dist2(b.x,b.y,o.x,o.y)<55*55)damageEnemy(o,b.dmg,b.x,b.y);
        break;}
      damageEnemy(e,b.dmg,b.x,b.y);burst(b.x,b.y,['#ffe066','#fff'],3,4);
      if(b.pierce>0)b.pierce--;else bullets.splice(i,1);
      break;}}}
  // enemy bullets
  for(let i=ebullets.length-1;i>=0;i--){const b=ebullets[i];
    if(frzT>0)continue;
    b.life-=dt;b.rot+=b.spin*dt;
    if(b.life<=0){ebullets.splice(i,1);continue;}
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(player.iT<=0&&dist2(b.x,b.y,player.x,player.y)<(b.r+player.r)*(b.r+player.r)){
      ebullets.splice(i,1);hurtPlayer(b.dmg);}}
  // zones
  for(let i=zones.length-1;i>=0;i--){const z=zones[i];
    if(frzT>0)continue;
    if(z.warn>0){z.warn-=dt;
      if(z.warn<=0){sThud();shake=Math.max(shake,4);
        fxs.push({kind:'nova',x:z.x,y:z.y,r:12,max:z.r,t:0,col:z.col});
        if(player.iT<=0&&dist2(z.x,z.y,player.x,player.y)<z.r*z.r)hurtPlayer(z.dmg);
        if(z.burn<=0){zones.splice(i,1);continue;}}}
    else{z.burn-=dt;
      if(player.iT<=0&&dist2(z.x,z.y,player.x,player.y)<z.r*z.r)hurtPlayer(z.dmg);
      if(z.burn<=0)zones.splice(i,1);}}
  // gems & coins & drops
  player.shieldT-=dt;frzT-=dt;skillCd-=dt;
  for(let i=gems.length-1;i>=0;i--){const g=gems[i];g.t+=dt;
    const d=Math.sqrt(dist2(g.x,g.y,player.x,player.y));
    if(g.vac){g.x+=(player.x-g.x)/d*980*dt;g.y+=(player.y-g.y)/d*980*dt;}
    else if(d<player.magnet){const pull=(1-d/player.magnet)*620+140;
      g.x+=(player.x-g.x)/d*pull*dt;g.y+=(player.y-g.y)/d*pull*dt;}
    if(d<24){gems.splice(i,1);sGem();gainXP(g.v);}}
  for(let i=coinDrops.length-1;i>=0;i--){const g=coinDrops[i];g.t+=dt;
    const d=Math.sqrt(dist2(g.x,g.y,player.x,player.y));
    if(g.vac){g.x+=(player.x-g.x)/d*980*dt;g.y+=(player.y-g.y)/d*980*dt;}
    else if(d<player.magnet){const pull=(1-d/player.magnet)*620+140;
      g.x+=(player.x-g.x)/d*pull*dt;g.y+=(player.y-g.y)/d*pull*dt;}
    if(d<26){coinDrops.splice(i,1);sCoin();
      const v=player.coinMul;runCoins+=v;
      floater(player.x,player.y-30,'🪙+'+v,'#ffd75a',false);}}
  for(let i=drops.length-1;i>=0;i--){const g=drops[i];g.t+=dt;
    const d=Math.sqrt(dist2(g.x,g.y,player.x,player.y));
    if(g.vac){g.x+=(player.x-g.x)/d*980*dt;g.y+=(player.y-g.y)/d*980*dt;}
    else if(d<player.magnet){const pull=(1-d/player.magnet)*620+140;
      g.x+=(player.x-g.x)/d*pull*dt;g.y+=(player.y-g.y)/d*pull*dt;}
    if(d<28){drops.splice(i,1);pickupDrop(g.kind);}}
  // fx
  for(let i=fxs.length-1;i>=0;i--){const f=fxs[i];f.t+=dt;
    if(f.kind==='nova')f.r+=(f.max-f.r)*dt*9;
    if(f.t>(f.kind==='bolt'?.14:f.kind==='hiss'?.5:.45))fxs.splice(i,1);}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];
    p.x+=p.vx;p.y+=p.vy;p.vx*=.94;p.vy*=.94;p.life-=dt*1.7;if(p.life<=0)parts.splice(i,1);}
  for(let i=floaters.length-1;i>=0;i--){const f=floaters[i];
    f.y-=dt*46;f.t-=dt*1.25;if(f.t<=0)floaters.splice(i,1);}
  for(let i=banners.length-1;i>=0;i--){const b=banners[i];
    b.t+=dt;if(b.t>b.dur)banners.splice(i,1);}
  comboT-=dt;if(comboT<=0&&combo>0){combo=0;lastMile=0;}
  if(pendingLv>0){levelDelay-=dt;
    if(levelDelay<=0){pendingLv--;showLevelup();}}
}
function gainXP(v){
  player.xp+=v;
  while(player.xp>=player.xpNext){
    player.xp-=player.xpNext;player.level++;
    player.xpNext=Math.floor(5+player.level*4+player.level*player.level*.32);
    pendingLv++;}
  if(pendingLv>0&&state==='playing'&&levelDelay<=0){
    levelDelay=.45;sLevel();flashW=.7;
    banner('🐾 LEVEL UP!','#ffe066',1);
    burst(player.x,player.y,['#ffe066','#7ec8ff'],30,10);shake=Math.max(shake,5);}}

// ============ draw ============
const ORB={r:7}; // mage orb drawn
function draw(){
  // bg
  const bgIdx=Math.min(stageIdx,2);
  ctx.fillStyle=SKY[bgIdx];ctx.fillRect(0,0,W,H);
  const ox=W/2-cam.x,oy=H/2-cam.y;
  function tile(img,alpha){
    ctx.globalAlpha=alpha;
    const sx=((ox%480)+480)%480-480,sy=((oy%480)+480)%480-480;
    for(let x=sx;x<W;x+=480)for(let y=sy;y<H;y+=480)ctx.drawImage(img,x,y);
    ctx.globalAlpha=1;}
  if(bgFade<1&&bgIdx>0){tile(BGS[prevBgIdx],1);tile(BGS[bgIdx],bgFade);}
  else tile(BGS[bgIdx],1);
  ctx.save();
  if(shake>.4)ctx.translate(rnd(-shake,shake),rnd(-shake,shake));
  ctx.translate(ox,oy);
  // zones
  for(const z of zones){
    if(z.warn>0){const pr=1-z.warn/z.max;
      ctx.globalAlpha=.3;ctx.fillStyle=z.col;
      ctx.beginPath();ctx.arc(z.x,z.y,z.r,0,TAU);ctx.fill();
      ctx.globalAlpha=.75;ctx.lineWidth=3;ctx.strokeStyle=z.col;
      ctx.beginPath();ctx.arc(z.x,z.y,z.r*pr,0,TAU);ctx.stroke();}
    else{ctx.globalAlpha=.32+.1*Math.sin(performance.now()/90);
      ctx.fillStyle=z.col;ctx.beginPath();ctx.arc(z.x,z.y,z.r,0,TAU);ctx.fill();}
    ctx.globalAlpha=1;}
  // gems
  for(const g of gems){const t=g.v>=8?'#ffd75a':g.v>=3?'#ff8ad8':'#7ec8ff';
    const b=1+Math.sin(g.t*6)*.15,r=(g.v>=8?9:g.v>=3?7:5.5)*b;
    ctx.save();ctx.translate(g.x,g.y);ctx.rotate(.785);
    ctx.fillStyle='#fff';ctx.fillRect(-r-2,-r-2,r*2+4,r*2+4);
    ctx.fillStyle=t;ctx.fillRect(-r,-r,r*2,r*2);ctx.restore();}
  for(const g of coinDrops){const b=1+Math.sin(g.t*7)*.1;
    drawStk(STK.coin,g.x,g.y,Math.sin(g.t*4)*.3,b);}
  for(const g of drops){const b=1+Math.sin(g.t*5)*.12;
    const s=g.kind==='chicken'?STK.chicken:STK[SKILLS[g.kind].stk];
    ctx.globalAlpha=.35;ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(g.x,g.y,20+Math.sin(g.t*5)*3,0,TAU);ctx.fill();ctx.globalAlpha=1;
    drawStk(s,g.x,g.y-Math.abs(Math.sin(g.t*3))*6,0,b);}
  // fx novas under
  for(const f of fxs){
    if(f.kind==='nova'){ctx.globalAlpha=Math.max(0,1-f.t/.45);
      ctx.strokeStyle=f.col;ctx.lineWidth=6;
      ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,TAU);ctx.stroke();
      ctx.globalAlpha*=.22;ctx.fillStyle=f.col;ctx.fill();ctx.globalAlpha=1;}}
  // enemy shadows & enemies
  for(const e of enemies){
    ctx.globalAlpha=.18;ctx.fillStyle='#143206';
    ctx.beginPath();ctx.ellipse(e.x,e.y+e.r*e.scale*.75,e.r*e.scale*.8,e.r*e.scale*.32,0,0,TAU);ctx.fill();
    ctx.globalAlpha=1;}
  for(const e of enemies){const s=STK[e.stk];
    const yy=e.y-(e.air||0);
    let rot=Math.sin(e.wob*2)*.12,sc=e.scale;
    if(e.beh==='rush'&&e.st.ph==='aim')rot=Math.sin(performance.now()/30)*.18;
    if(e.beh==='boar'&&e.st.ph==='aim')rot=Math.sin(performance.now()/30)*.15;
    if(e.beh==='turret')rot=Math.sin(e.wob)*.25;
    if(e.st&&e.st.fuse>=0&&e.st.fuse!==undefined)sc*=1+Math.sin(performance.now()/50)*.12;
    drawStk(s,e.x,yy,rot,sc,e.face===-1);
    if(e.flash>.08){ctx.save();ctx.globalAlpha=e.flash*.85;ctx.translate(e.x,yy);
      ctx.scale((e.face===-1?-1:1)*sc,sc);ctx.drawImage(s.w,-s.half,-s.half);ctx.restore();}
    if(e.beh==='boar'&&e.st.ph==='dizzy'){
      ctx.font='20px sans-serif';ctx.textAlign='center';
      ctx.fillText('💫',e.x+Math.cos(e.wob*4)*14,yy-e.r-16);}
    if(e.beh==='racc'){const o=e.st.orb||0;
      for(let i=0;i<3;i++){const a=o+i/3*TAU;
        drawStk(STK.trash,e.x+Math.cos(a)*88,yy+Math.sin(a)*88,a+1.2,1);}}
    if(e.boss){const bw=92;
      ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(e.x-bw/2,yy-e.r*sc-22,bw,9);
      ctx.fillStyle='#ff3860';ctx.fillRect(e.x-bw/2+1.5,yy-e.r*sc-20.5,(bw-3)*Math.max(0,e.hp/e.maxhp),6);}
    else if(e.meals>0){ctx.font='900 11px sans-serif';ctx.textAlign='center';
      ctx.fillStyle='#ffd75a';ctx.fillText('×'+e.meals+'냠',e.x,yy-e.r*sc-8);}
    // aim telegraph lines
    if((e.beh==='rush'||e.beh==='boar')&&e.st.ph==='aim'||
       (e.beh==='topgun'||e.beh==='mosqB')&&e.st.mode==='aim'||(e.beh==='mosqB'&&e.st.ph==='aim')){
      const ang=e.st.ang!==undefined&&e.st.ph==='aim'?e.st.ang:(e.st.ang2||0);

      ctx.globalAlpha=.4+.2*Math.sin(performance.now()/60);
      ctx.strokeStyle='#ff3860';ctx.lineWidth=4;ctx.setLineDash([12,8]);
      ctx.beginPath();ctx.moveTo(e.x,yy);
      ctx.lineTo(e.x+Math.cos(a2)*520,yy+Math.sin(a2)*520);ctx.stroke();
      ctx.setLineDash([]);ctx.globalAlpha=1;}}
  // blades (fish)
  if(player.weapons.blades){const w=player.weapons.blades,n=1+w.lv,R=74+6*w.lv;

  // bullets
  for(const b of bullets){

  for(const b of ebullets){
    if(b.spr==='orb'){ctx.fillStyle='#b66dff';ctx.strokeStyle='#fff';ctx.lineWidth=2.5;

    else drawStk(STK[b.spr],b.x,b.y,b.rot,1);}

      ctx.lineTo(f.x1+(f.x2-f.x1)*t+rnd(-13,13),f.y1+(f.y2-f.y1)*t+rnd(-13,13));}
    ctx.lineTo(f.x2,f.y2);ctx.stroke();}
  ctx.globalAlpha=1;
  // hiss text fx
  for(const f of fxs)if(f.kind==='hiss'){

    ctx.strokeText('하악-!!',f.x,f.y-46);ctx.fillStyle='#ff8ad8';ctx.fillText('하악-!!',f.x,f.y-46);
    ctx.globalAlpha=1;}
  // player
  if(state!=='dead'){
    ctx.globalAlpha=.2;ctx.fillStyle='#143206';
    ctx.beginPath();ctx.ellipse(player.x,player.y+16,16,6,0,0,TAU);ctx.fill();ctx.globalAlpha=1;
    const bob=Math.abs(Math.sin(walkT*11))*4;
    ctx.save();ctx.translate(player.x,player.y-bob);
    if(player.iT>0&&((player.iT*14)|0)%2===0)ctx.globalAlpha=.35;
    const pstk=STK[player.stk];
    ctx.rotate(Math.sin(walkT*11)*.08);
    ctx.scale(player.face===-1?-1:1,1);
    ctx.drawImage(pstk.n,-pstk.half,-pstk.half);
    ctx.restore();
    ctx.globalAlpha=.05;ctx.strokeStyle='#fff';ctx.beginPath();
    ctx.arc(player.x,player.y,player.magnet,0,TAU);ctx.stroke();ctx.globalAlpha=1;
    if(player.shieldT>0){
      ctx.globalAlpha=.5+.25*Math.sin(performance.now()/90);
      ctx.strokeStyle='#ffd75a';ctx.lineWidth=4;
      ctx.beginPath();ctx.arc(player.x,player.y-4,30,0,TAU);ctx.stroke();

      ctx.globalAlpha=1;}}

    ctx.globalAlpha=Math.min(inT,outT);
    ctx.font=`900 ${Math.min(W*.064,36)}px sans-serif`;ctx.textAlign='center';
    ctx.lineWidth=8;ctx.strokeStyle='rgba(40,30,10,.75)';ctx.strokeText(b.txt,0,0);
    ctx.fillStyle=b.col;ctx.fillText(b.txt,0,0);ctx.restore();}
  if(tutT>0&&state==='playing'&&gTime<6){
    ctx.globalAlpha=Math.min(1,tutT);ctx.font='900 16px sans-serif';ctx.textAlign='center';
    ctx.strokeStyle='rgba(0,0,0,.5)';ctx.lineWidth=4;
    const msg=IS_TOUCH?'아무데나 누르고 끌어서 이동! 공격은 자동 🐾':'WASD/방향키로 이동! 공격은 자동 🐾';
    ctx.strokeText(msg,W/2,H*.68);ctx.fillStyle='#fff';ctx.fillText(msg,W/2,H*.68);
    ctx.globalAlpha=1;}
}
function drawHUD(){
  if(state==='menu')return;
  const pad=14,top=16;
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(0,0,W,7);
  ctx.fillStyle='#ffe066';ctx.fillRect(0,0,W*clamp(player.xp/player.xpNext,0,1),7);
  ctx.font='900 13px sans-serif';ctx.textAlign='left';
  ctx.strokeStyle='rgba(0,0,0,.5)';ctx.lineWidth=3;
  ctx.strokeText('Lv.'+player.level,pad,top+12);
  ctx.fillStyle='#ffe066';ctx.fillText('Lv.'+player.level,pad,top+12);
  // hp bar
  const hbw=128,hfrac=clamp(player.hp/player.maxhp,0,1);
  ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(pad,top+19,hbw,16);
  ctx.fillStyle=hfrac>.5?'#52c84a':hfrac>.25?'#ffb02f':'#ff3860';
  ctx.fillRect(pad+2,top+21,(hbw-4)*hfrac,12);
  ctx.font='900 11px sans-serif';ctx.textAlign='center';
  ctx.strokeStyle='rgba(0,0,0,.55)';ctx.lineWidth=2.5;
  const htxt=Math.ceil(player.hp)+' / '+player.maxhp;
  ctx.strokeText(htxt,pad+hbw/2,top+31);
  ctx.fillStyle='#fff';ctx.fillText(htxt,pad+hbw/2,top+31);
  ctx.textAlign='left';
  ctx.font='13px serif';ctx.fillText('❤️',pad+hbw+6,top+32);
  // stage + timer
  const m=(gTime/60)|0,s=(gTime%60)|0;
  const stLabel=cleared?'😈 엔드리스':(stageIdx+1)+'-'+STAGES[stageIdx].name;
  ctx.textAlign='center';
  ctx.font='900 12px sans-serif';
  ctx.strokeText(stLabel,W/2,top+8);ctx.fillStyle='#fff';ctx.fillText(stLabel,W/2,top+8);
  ctx.font='900 24px sans-serif';
  const tstr=m+':'+String(s).padStart(2,'0');
  ctx.strokeText(tstr,W/2,top+32);ctx.fillStyle='#fff';ctx.fillText(tstr,W/2,top+32);
  // kills/coins
  ctx.textAlign='right';ctx.font='900 15px sans-serif';
  ctx.strokeText('💀 '+kills,W-pad,top+12);ctx.fillStyle='#fff';ctx.fillText('💀 '+kills,W-pad,top+12);
  ctx.strokeText('🪙 '+runCoins,W-pad,top+32);ctx.fillStyle='#ffe066';ctx.fillText('🪙 '+runCoins,W-pad,top+32);
  if(combo>2){ctx.font=`900 ${Math.min(19+combo*.5,32)}px sans-serif`;
    const ctxt=combo+' 콤보';
    ctx.strokeText(ctxt,W-pad,top+62);
    ctx.fillStyle=combo>=30?'#ffe066':'#fff';ctx.fillText(ctxt,W-pad,top+62);}
  // boss bars
  let by=top+50;
  for(const e of enemies)if(e.boss){
    const bw=Math.min(W*.55,300);
    ctx.textAlign='center';ctx.font='900 12px sans-serif';
    ctx.strokeText(e.boss,W/2,by+10);ctx.fillStyle='#fff';ctx.fillText(e.boss,W/2,by+10);
    ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(W/2-bw/2,by+15,bw,10);
    ctx.fillStyle='#ff3860';ctx.fillRect(W/2-bw/2+1.5,by+16.5,(bw-3)*Math.max(0,e.hp/e.maxhp),7);
    by+=30;}
}

// ============ main loop ============
let last=0;
function loop(t){
  requestAnimationFrame(loop);
  let dt=Math.min(.04,(t-last)/1000)||0;last=t;
  shake*=Math.pow(.0001,dt);flashR*=Math.pow(.01,dt);flashW*=Math.pow(.01,dt);
  if(state==='countdown'){
    cdT-=dt;
    if(cdT<=0){state='playing';}
    else{const n=Math.ceil(cdT);
      if(n!==lastCdN){lastCdN=n;tone(n===1?880:660,.12,'square',.18);}}
    draw();
    ctx.fillStyle='rgba(125,125,125,.55)';ctx.fillRect(0,0,W,H);
    if(cdT>0){const n=Math.ceil(cdT),frac=cdT-Math.floor(cdT);
      const sc=1+frac*.4;
      ctx.save();ctx.translate(W/2,H/2);ctx.scale(sc,sc);
      ctx.font='900 110px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.lineWidth=10;ctx.strokeStyle='rgba(40,40,40,.8)';ctx.strokeText(n,0,0);
      ctx.fillStyle='#fff';ctx.fillText(n,0,0);ctx.restore();}
    return;}
  if(freezeT>0){freezeT-=dt;draw();return;}
  let ts=1;
  if(slowT>0){slowT-=dt;ts=.3;}
  if(state==='playing')update(dt*ts);
  draw();}
requestAnimationFrame(loop);

// ============ input ============
addEventListener('keydown',e=>{keys[e.key]=true;
  if(e.key==='p'||e.key==='P'||e.key==='Escape'){if(state==='playing')pauseGame();else if(state==='paused')resumeGame();}
  if(e.key==='m'||e.key==='M')toggleMute();
  if(e.key===' '){e.preventDefault();useSkill();}});
addEventListener('keyup',e=>{keys[e.key]=false;});
function skillBtnPos(){return {x:66,y:H-92,r:44};}
cv.addEventListener('pointerdown',e=>{ac();
  if(state!=='playing')return;
  if(player.skill){const b=skillBtnPos();
    if(dist2(e.clientX,e.clientY,b.x,b.y)<b.r*b.r){useSkill();return;}}
  if(joy.id!==-1)return;
  joy.on=true;joy.id=e.pointerId;joy.ax=e.clientX;joy.ay=e.clientY;joy.dx=0;joy.dy=0;});
addEventListener('pointermove',e=>{
  if(!joy.on||e.pointerId!==joy.id)return;
  let dx=e.clientX-joy.ax,dy=e.clientY-joy.ay;const d=Math.hypot(dx,dy);
  if(d<8){joy.dx=0;joy.dy=0;return;}
  if(d>56){joy.ax=e.clientX-dx/d*56;joy.ay=e.clientY-dy/d*56;dx=dx/d*56;dy=dy/d*56;}
  joy.dx=dx/56;joy.dy=dy/56;});
const endJoy=e=>{if(e.pointerId===joy.id){joy.on=false;joy.id=-1;joy.dx=0;joy.dy=0;}};
addEventListener('pointerup',endJoy);addEventListener('pointercancel',endJoy);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')pauseGame();});
document.addEventListener('contextmenu',e=>e.preventDefault());

// ============ UI flow ============
function show(id){$(id).classList.remove('hidden');}
function hide(id){$(id).classList.add('hidden');}
function startRun(){ac();sMeow();resetRun();state='playing';
  hide('menu');hide('results');show('hudBtns');mStep=0;mNext=0;bossSpawned=false;
  banner('STAGE 1 · '+STAGES[0].name+' '+STAGES[0].icon,'#fff',2.2);}
function pauseGame(){if(state!=='playing')return;state='paused';show('pauseOv');}
function resumeGame(){if(state!=='paused')return;
  hide('pauseOv');ac();state='countdown';cdT=3;lastCdN=0;}
function fmtT(t){return ((t/60)|0)+':'+String((t%60)|0).padStart(2,'0');}
function rankOf(){
  if(cleared&&gTime>=endlessAt+120)return'👑 전설의 길고양이';
  if(cleared)return'🥇 동네 평정!';
  if(stageIdx>=2)return'🥈 뒷산의 전사';
  if(stageIdx>=1)return'🥉 골목대장';
  if(gTime>=60)return'🐈 동네 한 바퀴';
  return'🐣 츄르가 필요해';}
function gameOver(){
  state='dead';sDead();slowT=.8;shake=16;
  burst(player.x,player.y,['#7ec8ff','#ff8ad8','#fff'],70,13);puff(player.x,player.y,12);
  coins+=runCoins;saveCats();
  const nbT=gTime>bestT,nbK=kills>bestK;
  if(nbT){bestT=gTime;localStorage.setItem('ns2_bestT',bestT);}
  if(nbK){bestK=kills;localStorage.setItem('ns2_bestK',bestK);}
  setTimeout(()=>{
    $('rTime').textContent=fmtT(gTime);
    $('rRank').textContent=rankOf();
    $('rKills').textContent=kills;$('rLv').textContent=player.level;$('rCombo').textContent=maxCombo;
    $('rCoins').textContent=runCoins;
    $('rBest').innerHTML=(nbT||nbK)?'<span style="color:#3a8d2f;font-weight:900">🎉 신기록 갱신!!</span>'
      :'최고: '+fmtT(bestT)+' 생존 · '+bestK+'킬';
    hide('hudBtns');show('results');},1100);}
// level up
function cardHTML(p){
  const D=p.kind==='w'?WEAPONS[p.key]:PASSIVES[p.key];
  let cl;
  if(p.kind==='w'){
    const gain=TGAIN[p.tier],target=Math.min(WEAPONS[p.key].max,p.lv+gain);
    cl=p.lv===0?(gain>1?'✨ NEW! Lv.'+Math.min(WEAPONS[p.key].max,gain)+'!':'✨ NEW!')
      :'Lv.'+p.lv+' → '+target+(gain>1?'!!':'');}
  else cl=(p.tier==='S'?'초강화!':p.tier==='A'?'강화!':'강화');
  return `<div class="tb t${p.tier}">${p.tier}</div>
    <div class="ci">${D.icon}</div><div class="cn">${D.name}</div>
    <div class="cl">${cl}</div>
    <div class="cd">${D.desc(p.lv,p.tier)}</div>`;}
function rollPool(){
  const pool=[];
  for(const k in WEAPONS){const lv=player.weapons[k]?player.weapons[k].lv:0;
    if(lv<WEAPONS[k].max)pool.push({kind:'w',key:k,lv,wgt:lv?3:(Object.keys(player.weapons).length<3?3.5:1.3)});}
  for(const k in PASSIVES){
    if((player.passN[k]||0)<6)pool.push({kind:'p',key:k,lv:player.passN[k]||0,wgt:2});}
  return pool;}
function showLevelup(){
  state='levelup';
  const wrap=$('luCards');wrap.innerHTML='';
  const pool=rollPool();
  const picks=[];
  for(let i=0;i<3&&pool.length;i++){
    let tot=0;for(const p of pool)tot+=p.wgt;
    let r=Math.random()*tot,idx=0;
    for(let j=0;j<pool.length;j++){r-=pool[j].wgt;if(r<=0){idx=j;break;}}
    const pk=pool.splice(idx,1)[0];pk.tier=rollTier();
    picks.push(pk);}
  if(!picks.length){state='playing';return;}
  picks.forEach((p,i)=>{
    const el=document.createElement('div');
    el.className='card t'+p.tier+(p.lv===0&&p.kind==='w'?' new':'');
    el.style.animationDelay=(i*.09)+'s';
    el.innerHTML=cardHTML(p);
    el.onclick=()=>{applyPick(p);hide('levelup');sPick();
      if(p.tier==='S'){sChest();flashW=.8;}
      state='playing';ac();
      if(pendingLv>0)levelDelay=.3;};
    wrap.appendChild(el);});
  show('levelup');}
function applyPick(p){
  const tier=p.tier||'C';
  if(p.kind==='w'){
    const gain=TGAIN[tier];
    if(!player.weapons[p.key])player.weapons[p.key]={lv:Math.min(WEAPONS[p.key].max,gain),t:0};
    else player.weapons[p.key].lv=Math.min(WEAPONS[p.key].max,player.weapons[p.key].lv+gain);}
  else{const v=PV[p.key][tier];
    player.passN[p.key]=(player.passN[p.key]||0)+1;
    if(p.key==='hp'){player.maxhp+=v;
      player.hp=tier==='S'?player.maxhp:Math.min(player.maxhp,player.hp+v);}
    else if(p.key==='cd')player.cdAcc*=(1-v);
    else player.pass[p.key]+=v;
    recompute();}}
// chest
let chestPick=null;
function openChest(){
  setTimeout(()=>{if(state!=='playing')return;
    state='chest';sChest();
    hide('hudBtns');$('chestCard').classList.add('hidden');$('chestBox').style.display='block';
    show('chest');
    setTimeout(()=>{
      $('chestBox').style.display='none';
      const opts=rollPool();
      let html;
      if(opts.length){chestPick=opts[(Math.random()*opts.length)|0];
        chestPick.tier=Math.random()<.65?'A':'S';
        html=`<div class="card t${chestPick.tier} new">${cardHTML(chestPick)}</div>`;}
      else{chestPick=null;html=`<div class="card new tS"><div class="tb tS">S</div><div class="ci">💖</div><div class="cn">풀 회복!</div><div class="cd">이미 풀빌드! 체력 전부 회복</div></div>`;}
      $('chestInner').innerHTML=html;
      $('chestCard').classList.remove('hidden');},1000);},800);}
$('chestClaim').onclick=()=>{
  if(chestPick)applyPick(chestPick);else player.hp=player.maxhp;
  hide('chest');show('hudBtns');sPick();state='playing';ac();};
// menu / shop
function refreshMenu(){
  $('mHow').innerHTML=IS_TOUCH?'🎮 <b>누르고 끌어서</b> 이동 — 공격은 자동!':'🎮 <b>WASD / 방향키</b> 이동 — 공격은 자동!';
  $('mCoins').textContent=coins;
  $('mBest').textContent=bestT>0?`내 최고 기록: ${fmtT(bestT)} 생존 · ${bestK}킬`:'';
  const row=$('catRow');row.innerHTML='';
  for(const c of CATS){
    const has=owned.includes(c.key);
    const el=document.createElement('div');
    el.className='cat'+(selCat===c.key?' sel':'')+(has?'':' locked');
    el.innerHTML=`<div class="ce"><img src="${STK[c.stk].n.toDataURL()}" width="54" height="54" style="image-rendering:auto"></div>
      <div class="cn2">${c.name}</div>
      <div class="cp">${c.perk.replace('\n','<br>')}</div>
      <div class="price">${has?(selCat===c.key?'✔ 선택됨':'선택'):'🪙'+c.price}</div>`;
    el.onclick=()=>{ac();
      if(has){selCat=c.key;saveCats();sPick();refreshMenu();}
      else if(coins>=c.price){coins-=c.price;owned.push(c.key);selCat=c.key;saveCats();
        sChest();refreshMenu();
        const t=$('toast');t.textContent=c.name+' 영입 완료! 🎉';t.style.opacity=1;
        setTimeout(()=>t.style.opacity=0,1600);}
      else{sHiss();
        const t=$('toast');t.textContent='코인 부족! 🪙'+(c.price-coins)+' 더 필요';t.style.opacity=1;
        setTimeout(()=>t.style.opacity=0,1600);}};
    row.appendChild(el);}}
$('mStart').onclick=startRun;
$('rRetry').onclick=startRun;
$('rHome').onclick=()=>{hide('results');show('menu');state='menu';refreshMenu();};
$('pResume').onclick=resumeGame;
$('pQuit').onclick=()=>{hide('pauseOv');gameOver();};
$('hudPause').onclick=()=>{if(state==='playing')pauseGame();};
function toggleMute(){muted=!muted;localStorage.setItem('ns_mute',muted?'1':'0');
  if(master)master.gain.value=muted?0:.55;
  $('hudMute').textContent=muted?'🔇':'🔊';}
$('hudMute').onclick=toggleMute;
$('hudMute').textContent=muted?'🔇':'🔊';
$('rShare').onclick=async()=>{
  const cat=CATS.find(c=>c.key===selCat);
  const txt=`🐱 냥냥 서바이버 ${fmtT(gTime)} 생존 · ${kills}킬 · ${rankOf()} (${cat.name}) — 나 이겨봐! ${location.href}`;
  try{
    if(navigator.share){await navigator.share({text:txt});return;}
    await navigator.clipboard.writeText(txt);
    const t=$('toast');t.textContent='복사 완료! 📋';t.style.opacity=1;setTimeout(()=>t.style.opacity=0,1800);
  }catch(e){}};
refreshMenu();
</script>
