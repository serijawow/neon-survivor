<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>냥냥 서바이버 🐾</title>
<meta property="og:title" content="냥냥 서바이버 🐾">
<meta property="og:description" content="낮잠을 방해한 동네 악당들을 혼내주는 고양이 액션! 8개 스테이지를 클리어하고 동네를 지켜라!">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🐾</text></svg>">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#7fbe5e;
    font-family:'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    touch-action:none;user-select:none;-webkit-user-select:none;color:#4a3b2a}
  #c{display:block;width:100%;height:100%}
  .ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;z-index:10;padding:14px;background:rgba(46,66,38,.6);backdrop-filter:blur(6px);overflow-y:auto}
  .hidden{display:none !important}
  .panel{background:#fff8e8;border-radius:24px;padding:22px 18px;max-width:500px;width:100%;
    box-shadow:0 10px 0 rgba(0,0,0,.18),0 16px 40px rgba(0,0,0,.3);border:4px solid #5a4632;position:relative}
  h1{font-size:min(10.5vw,46px);font-weight:900;letter-spacing:-1px;line-height:1.12;color:#e8651f;
    text-shadow:2.5px 3px 0 #5a4632,-1px -1px 0 #fff}
  .sub{font-size:min(3.9vw,15px);color:#7a6a52;margin:10px 0 4px;line-height:1.65}
  .sub b{color:#e8651f}
  button{border:3px solid #5a4632;border-radius:50px;padding:13px 36px;font-size:min(5.2vw,20px);font-weight:900;
    color:#fff;cursor:pointer;font-family:inherit;background:linear-gradient(180deg,#ffb02f,#ff8c2f);
    box-shadow:0 5px 0 #5a4632;transition:transform .08s;margin:6px 4px;text-shadow:0 1.5px 0 rgba(0,0,0,.25)}
  button:active{transform:translateY(4px);box-shadow:0 1px 0 #5a4632}
  button.ghost{background:#efe6d2;color:#7a6a52;text-shadow:none;font-size:min(4vw,15px);padding:10px 24px}
  button.big{display:block;width:100%;margin:7px 0;padding:15px;font-size:min(5.6vw,21px)}
  button.blue{background:linear-gradient(180deg,#5fb6e8,#3f96d8)}
  button.green{background:linear-gradient(180deg,#7ec85e,#5aa843)}
  button.pink{background:linear-gradient(180deg,#ff8ab0,#f06a96)}
  button:disabled{filter:grayscale(.8);opacity:.6;transform:none}
  input{border:3px solid #5a4632;border-radius:14px;padding:12px;font-size:18px;font-weight:800;
    font-family:inherit;width:100%;text-align:center;background:#fff;color:#4a3b2a;outline:none}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .nick{font-weight:900;font-size:15px;color:#5a4632}
  .coins{font-weight:900;font-size:16px;color:#c9820a}
  /* stage grid */
  #stageGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:12px 0 4px}
  .stg{background:#fff;border:3px solid #cdbfa4;border-radius:16px;padding:9px 4px 7px;cursor:pointer;
    transition:transform .08s;position:relative}
  .stg:active{transform:scale(.93)}
  .stg.lock{filter:grayscale(.9);opacity:.55}
  .stg.cur{border-color:#e8651f;box-shadow:0 0 0 3px #ffd9a8}
  .stg .si{font-size:26px;line-height:1.1}
  .stg .sn{font-size:10.5px;font-weight:900;margin-top:2px;color:#5a4632;line-height:1.2}
  .stg .sc{font-size:10px;color:#5aa843;font-weight:900;min-height:13px}
  /* shop */
  .uprow{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid #e3d8c0;
    border-radius:16px;padding:9px 12px;margin:7px 0;text-align:left}
  .uprow .ui{font-size:26px;width:36px;text-align:center}
  .uprow .ut{flex:1}
  .uprow .un{font-weight:900;font-size:14.5px;color:#4a3b2a}
  .uprow .ud{font-size:11.5px;color:#9a8a6e;line-height:1.3}
  .uprow .pips{display:flex;gap:3px;margin-top:3px}
  .pip{width:14px;height:7px;border-radius:4px;background:#e3d8c0}
  .pip.on{background:#5aa843}
  .uprow button{margin:0;padding:9px 14px;font-size:13px;border-radius:14px;white-space:nowrap}
  /* cats */
  #catGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:10px 0}
  .cat{background:#fff;border:3px solid #e3d8c0;border-radius:18px;padding:10px 6px;cursor:pointer;
    transition:transform .08s;position:relative}
  .cat:active{transform:scale(.95)}
  .cat.sel{border-color:#5aa843;box-shadow:0 0 0 3px #c4e8ae}
  .cat.locked{filter:grayscale(.8);opacity:.75}
  .cat .cn2{font-size:14px;font-weight:900;color:#4a3b2a;margin-top:2px}
  .cat .cp{font-size:11px;color:#9a8a6e;line-height:1.4;margin-top:2px;min-height:30px}
  .cat .price{font-size:13px;font-weight:900;color:#c9820a;margin-top:3px}
  /* level-up cards */
  .lutitle{font-size:min(8vw,34px);font-weight:900;color:#fff;margin-bottom:14px;
    text-shadow:0 3px 0 rgba(0,0,0,.35);animation:bump .45s cubic-bezier(.2,2.4,.4,1)}
  @keyframes bump{0%{transform:scale(.2)}100%{transform:scale(1)}}
  #luCards,#chestRow{display:flex;gap:11px;width:100%;max-width:540px;justify-content:center;flex-wrap:wrap}
  .card{flex:1 1 0;min-width:126px;max-width:168px;background:#fff8e8;border:3.5px solid #cdbfa4;
    border-radius:18px;padding:14px 9px 12px;cursor:pointer;color:#4a3b2a;position:relative;
    animation:cardin .4s cubic-bezier(.2,1.6,.4,1) backwards;transition:transform .1s;
    box-shadow:0 6px 0 rgba(90,70,50,.55),0 10px 24px rgba(0,0,0,.35)}
  .card:active{transform:scale(.94)}
  @keyframes cardin{from{transform:translateY(60px) scale(.6);opacity:0}}
  .ci{height:54px;display:flex;align-items:center;justify-content:center}
  .ci img{width:52px;height:52px}
  .ci .em{font-size:42px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.18))}
  .cn{font-weight:900;font-size:15px;margin:7px 0 3px}
  .cl{font-size:11.5px;font-weight:900;color:#e8651f;margin-bottom:4px}
  .cd{font-size:11.5px;color:#8a7a5e;line-height:1.4}
  .tb{position:absolute;top:-13px;right:-9px;min-width:34px;height:34px;border-radius:50%;padding:0 4px;
    display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;color:#fff;
    border:3px solid #fff8e8;box-shadow:0 3px 6px rgba(0,0,0,.3)}
  .card.tC{border-color:#b8b4a4}.tb.tC{background:#9aa39b}
  .card.tB{border-color:#4f9bff}.tb.tB{background:#4f9bff}
  .card.tA{border-color:#b66dff;box-shadow:0 6px 0 rgba(90,70,50,.55),0 0 16px rgba(182,109,255,.6)}.tb.tA{background:#b66dff}
  .card.tS{border-color:#ffb02f;box-shadow:0 6px 0 rgba(90,70,50,.55),0 0 22px rgba(255,176,47,.9)}.tb.tS{background:linear-gradient(135deg,#ffb02f,#ff5f3c)}
  .card.tSS{border-color:#ff4f8a;box-shadow:0 6px 0 rgba(90,70,50,.55),0 0 26px rgba(255,79,138,1);
    animation:cardin .4s cubic-bezier(.2,1.6,.4,1) backwards,ssglow .8s ease-in-out infinite alternate}
  .tb.tSS{background:linear-gradient(135deg,#ff4f8a,#b66dff);font-size:13px}
  @keyframes ssglow{from{box-shadow:0 6px 0 rgba(90,70,50,.55),0 0 16px rgba(255,79,138,.7)}to{box-shadow:0 6px 0 rgba(90,70,50,.55),0 0 34px rgba(255,79,138,1)}}
  .card.back{background:linear-gradient(160deg,#ff9b2f,#e8651f);border-color:#5a4632;display:flex;
    align-items:center;justify-content:center;min-height:150px;font-size:44px}
  .card.dim{opacity:.45;pointer-events:none}
  #chestBox{font-size:84px;animation:shake .12s linear infinite;filter:drop-shadow(0 0 24px rgba(255,210,80,.9))}
  @keyframes shake{0%{transform:rotate(-7deg) scale(1.05)}50%{transform:rotate(7deg)}100%{transform:rotate(-7deg) scale(1.05)}}
  /* results */
  .big{font-size:min(14vw,62px);font-weight:900;line-height:1.05;color:#e8651f;text-shadow:2px 3px 0 #5a4632}
  .rk{font-size:min(6.5vw,26px);font-weight:900;color:#c9820a;margin:7px 0 2px}
  .stats{display:flex;gap:18px;margin:10px 0 4px;font-size:min(3.8vw,14px);justify-content:center;color:#9a8a6e}
  .stats b{display:block;font-size:min(6vw,23px);color:#5aa843}
  #hudBtns{position:fixed;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:8;display:flex;gap:10px}
  #hudBtns button{padding:0;width:46px;height:46px;border-radius:50%;font-size:19px;margin:0;
    background:rgba(255,248,232,.92);color:#5a4632;box-shadow:0 3px 0 #5a4632}
  #toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#5aa843;color:#fff;
    font-weight:900;padding:11px 26px;border-radius:30px;font-size:14px;z-index:40;opacity:0;
    transition:opacity .3s;pointer-events:none;white-space:nowrap;border:3px solid #fff}
  /* cutscene */
  #cutPanelWrap{max-width:480px;width:100%;border:4px solid #5a4632;border-radius:18px;overflow:hidden;
    box-shadow:0 12px 36px rgba(0,0,0,.45);background:#fff}
  #cutCanvas{display:block;width:100%}
  #cutHint{color:#fff;font-weight:900;margin-top:12px;font-size:15px;animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.4}}
  textarea{border:3px solid #5a4632;border-radius:12px;width:100%;font-family:monospace;font-size:11px;
    padding:8px;height:64px;resize:none;background:#fff}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hudBtns" class="hidden">
  <button id="hudMute">🔊</button><button id="hudPause">⏸</button>
</div>

<!-- first-run name -->
<div id="login" class="ov hidden">
  <div class="panel">
    <h1 style="font-size:min(8vw,34px)">처음 왔구나!</h1>
    <div class="sub">집사… 아니, 고양이님의 <b>이름</b>을 알려줘!<br>(이 기기에 자동 저장돼요)</div>
    <input id="loginName" maxlength="8" placeholder="냥이름 (8자 이내)">
    <button id="loginGo" class="big green" style="margin-top:12px">시작하기 🐾</button>
  </div>
</div>

<!-- main menu -->
<div id="menu" class="ov">
  <div class="panel" id="scrHome">
    <div class="topbar"><span class="nick" id="nickLabel"></span><span class="coins" id="coinLabel"></span></div>
    <h1>냥냥<br>서바이버 🐾</h1>
    <div class="sub" id="homeSub">낮잠을 방해한 동네 악당들을 혼내주자!</div>
    <div id="homeCat" style="margin:6px 0"></div>
    <button id="btnPlay" class="big green">▶ 모험 떠나기</button>
    <button id="btnCats" class="big blue">🐱 고양이</button>
    <button id="btnShop" class="big pink">⬆ 능력 업그레이드</button>
    <div>
      <button id="btnInvite" class="ghost">📤 친구 초대</button>
      <button id="btnCode" class="ghost">💾 이어하기 코드</button>
    </div>
  </div>
  <div class="panel hidden" id="scrStage">
    <div class="topbar"><b style="font-size:18px">🗺 스테이지</b><span class="coins" id="coinLabel2"></span></div>
    <div id="stageGrid"></div>
    <div class="sub" id="stageDesc" style="min-height:38px"></div>
    <button id="stageGo" class="big green">출동! 🐾</button>
    <button class="ghost backBtn">← 뒤로</button>
  </div>
  <div class="panel hidden" id="scrShop">
    <div class="topbar"><b style="font-size:18px">⬆ 능력 업그레이드</b><span class="coins" id="coinLabel3"></span></div>
    <div class="sub" style="margin:0 0 4px">코인으로 영구 능력치를 올려서 재도전!</div>
    <div id="shopList"></div>
    <button class="ghost backBtn">← 뒤로</button>
  </div>
  <div class="panel hidden" id="scrCats">
    <div class="topbar"><b style="font-size:18px">🐱 고양이 식구들</b><span class="coins" id="coinLabel4"></span></div>
    <div id="catGrid"></div>
    <button class="ghost backBtn">← 뒤로</button>
  </div>
  <div class="panel hidden" id="scrCode">
    <b style="font-size:18px">💾 이어하기 코드</b>
    <div class="sub">코드를 복사해두면 다른 기기/브라우저에서<br>진행 상황을 이어할 수 있어요.</div>
    <textarea id="codeText" readonly></textarea>
    <button id="codeCopy" class="ghost">📋 복사</button>
    <div class="sub" style="margin-top:10px"><b>코드 입력</b>으로 불러오기:</div>
    <textarea id="codeInput" placeholder="여기에 코드 붙여넣기"></textarea>
    <button id="codeImport" class="ghost">불러오기</button>
    <button class="ghost backBtn">← 뒤로</button>
  </div>
</div>

<!-- cutscene -->
<div id="cut" class="ov hidden">
  <div id="cutPanelWrap"><canvas id="cutCanvas" width="480" height="250"></canvas></div>
  <div id="cutHint">👆 탭해서 시작!</div>
</div>

<!-- level up -->
<div id="levelup" class="ov hidden">
  <div class="lutitle">🐾 LEVEL UP!</div>
  <div id="luCards"></div>
</div>

<!-- chest (elite reward: pick 1 of 3) -->
<div id="chest" class="ov hidden">
  <div class="lutitle" id="chestTitle">🎁 전리품!</div>
  <div id="chestBox">🎁</div>
  <div id="chestRow" class="hidden"></div>
  <button id="chestClaim" class="hidden">획득 ✨</button>
</div>

<div id="pauseOv" class="ov hidden">
  <div class="lutitle">일시정지 😺</div>
  <button id="pResume" class="green">계속하기 ▶</button>
  <button id="pQuit" class="ghost">포기하고 메인으로 🏳</button>
</div>

<!-- results -->
<div id="results" class="ov hidden">
  <div class="panel">
    <div class="big" id="rTitle">클리어!</div>
    <div class="rk" id="rSub"></div>
    <div class="stats">
      <div><b id="rTime">0:00</b>시간</div>
      <div><b id="rKills">0</b>처치</div>
      <div><b id="rLv">1</b>레벨</div>
      <div><b id="rCoins">0</b>🪙획득</div>
    </div>
    <div class="sub" id="rHint"></div>
    <button id="rNext" class="big green hidden">다음 스테이지 ▶</button>
    <button id="rRetry" class="big blue">한 판 더! 🔁</button>
    <button id="rHome" class="ghost">메인으로</button>
  </div>
</div>

<div id="toast">…</div>
<script src="art.js"></script>
<script src="game.js"></script>
</body>
</html>
